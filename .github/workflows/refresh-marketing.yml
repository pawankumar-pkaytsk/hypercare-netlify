name: Refresh marketing snapshot

# Lightweight companion to refresh.yml. Rebuilds ONLY mb/marketingSellers.json
# (cards 11011 + 7753 + 2787, ~20s) so the Marketing views recover quickly from
# card 11011's ISO-week rollover, which happens every Monday 00:00 UTC. The
# once-daily full refresh alone left the dashboard showing last week's PNL/spend
# for most of Monday morning IST.
on:
  schedule:
    # Minutes are deliberately NOT :00. GitHub queues scheduled workflows by load and
    # on-the-hour slots are the most contended: with "0 1 * * *" this job was landing
    # ~5h late (01:00 -> 06:07, 07:00 -> 12:24, 13:00 -> 17:14 on 2026-08-30), which
    # meant the Monday ISO-week rollover was not picked up until mid-morning IST and
    # users saw the amber "1 week behind" banner all morning. Off-peak minutes get
    # picked up far closer to schedule.
    - cron: "23 0 * * *"   # 05:53 IST — minutes after the Monday 00:00 UTC rollover
    - cron: "19 6 * * *"   # 11:49 IST
    - cron: "41 12 * * *"  # 18:11 IST
    # NOTE: Monday-only extra slots used to live here. They did not work — GitHub delays
    # EVERY slot on this repo by the same ~4-5h, so extra attempts all arrive late too.
    # The Monday rollover is now handled by refresh-monday.yml, which is scheduled early
    # on Sunday and waits until just after 00:00 UTC.
  workflow_dispatch: {}

# Share the full-refresh lock so the two jobs never race on push.
concurrency:
  group: hypercare-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  refresh-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild marketingSellers.json (cards 11011 + 7753 + 2787)
        env:
          HC_REPO: ${{ github.workspace }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USER_EMAIL: ${{ secrets.METABASE_USER_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python3 mb/snapshot.py --marketing-only

      - name: Commit if changed
        run: |
          git config user.name "hypercare-bot"
          git config user.email "kickstarter@blitzscale.co"
          # build_assignment_history() also rewrites mb/assignmentHistory.json on every
          # run. Staging only marketingSellers.json left that file dirty, and the
          # `git pull --rebase` below then aborted with "cannot pull with rebase: You
          # have unstaged changes" — which failed the job AND lost the ledger update.
          git add mb/marketingSellers.json mb/assignmentHistory.json
          if git diff --cached --quiet; then
            echo "No marketing data changes."
          else
            git commit -m "Marketing snapshot refresh ($(date -u +%FT%TZ))"
            # The full-refresh job may have pushed while we were querying.
            git pull --rebase origin main
            git push
            echo "Pushed refreshed marketing snapshot."
          fi

      - name: Force a fresh Pages build (legacy builds can hang)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
